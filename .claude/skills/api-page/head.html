<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root {
  --bg: #f5f8f9;
  --surface: #ffffff;
  --ink: #15232a;
  --muted: #56676f;
  --line: #d9e2e5;
  --accent: #00708c;
  --code-bg: #edf3f5;
  --new: #1f7a45;
  --new-bg: #e2f3e8;
  --changed: #8a5a00;
  --changed-bg: #fbefd2;
  --gone: #a33434;
  --gone-bg: #f9e1e1;
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0f171a;
    --surface: #142024;
    --ink: #dbe6e9;
    --muted: #8ea1a8;
    --line: #25353a;
    --accent: #45c3e0;
    --code-bg: #182a30;
    --new: #74d39b;
    --new-bg: #173a27;
    --changed: #e8b851;
    --changed-bg: #3d2f10;
    --gone: #f28b8b;
    --gone-bg: #3f1c1c;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f171a;
  --surface: #142024;
  --ink: #dbe6e9;
  --muted: #8ea1a8;
  --line: #25353a;
  --accent: #45c3e0;
  --code-bg: #182a30;
  --new: #74d39b;
  --new-bg: #173a27;
  --changed: #e8b851;
  --changed-bg: #3d2f10;
  --gone: #f28b8b;
  --gone-bg: #3f1c1c;
}
html { scroll-padding-top: 1rem; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 15.5px/1.6 var(--sans);
  padding-inline: 16px;
}
a { color: var(--accent); text-decoration-thickness: 1px; text-underline-offset: 2px; }
a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre { font-family: var(--mono); font-size: 0.86em; }
.layout {
  display: grid;
  grid-template-columns: 15rem minmax(0, 1fr);
  gap: 2.5rem;
  max-width: 76rem;
  margin-inline: auto;
  padding-block: 2rem 4rem;
}
.side { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); align-self: start; max-height: calc(100vh - 2rem); overflow-y: auto; }
.side ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.15rem; }
.side .group { margin-block-end: 0.9rem; }
.side .group > span {
  display: block; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--muted); margin-block-end: 0.3rem; font-weight: 600;
}
.side a { display: flex; justify-content: space-between; gap: 0.5rem; color: var(--ink); text-decoration: none; font-family: var(--mono); font-size: 0.82rem; padding: 0.15rem 0.4rem; border-radius: 4px; }
.side a:hover { background: var(--code-bg); }
.side a.done::after { content: "✓"; color: var(--new); font-family: var(--sans); }
main { min-width: 0; max-width: 52rem; }
h1, h2, h3, h4 { text-wrap: balance; line-height: 1.25; }
h1 { font-size: 2rem; font-weight: 600; margin: 0 0 0.6rem; letter-spacing: -0.01em; }
h2 { font-size: 1.5rem; font-weight: 600; margin: 0; font-family: var(--mono); letter-spacing: -0.01em; }
h2 a { color: var(--ink); text-decoration: none; }
h3 { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 2.2rem 0 0.8rem; font-weight: 600; }
.lede { color: var(--muted); max-width: 65ch; margin: 0; }
.intro { padding-block-end: 1.5rem; }
.table-wrap { overflow-x: auto; }
.summary { border-collapse: collapse; font-size: 0.9rem; min-width: 26rem; }
.summary th, .summary td { padding: 0.35rem 0.9rem 0.35rem 0; border-bottom: 1px solid var(--line); text-align: left; }
.summary thead th { font-size: 0.72rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.summary tbody th { font-family: var(--mono); font-weight: 400; font-size: 0.85rem; }
.num { text-align: right !important; font-variant-numeric: tabular-nums; width: 5.5rem; }
.zero { color: var(--muted); }
.count { display: inline-block; min-width: 1.8rem; text-align: center; border-radius: 999px; padding: 0 0.4rem; font-weight: 600; }
.count.new { color: var(--new); background: var(--new-bg); }
.count.changed { color: var(--changed); background: var(--changed-bg); }
.count.gone { color: var(--gone); background: var(--gone-bg); }
.badge { display: inline-block; vertical-align: 0.15em; margin-inline-start: 0.4rem; font: 600 0.68rem/1.5 var(--sans); letter-spacing: 0.05em; text-transform: uppercase; padding: 0 0.45rem; border-radius: 4px; }
.badge.new { color: var(--new); background: var(--new-bg); }
.badge.changed { color: var(--changed); background: var(--changed-bg); }
.badge.gone { color: var(--gone); background: var(--gone-bg); margin-inline-start: 0; }
.legend { list-style: none; padding: 0; display: grid; gap: 0.35rem; color: var(--muted); font-size: 0.85rem; }
.legend .badge { margin-inline-end: 0.4rem; }
.legend .badge { margin-inline-start: 0; }
.gone-pkgs { margin-block: 1rem 0.3rem; color: var(--muted); font-size: 0.9rem; }
.gone-list { margin: 0; padding-inline-start: 1.2rem; font-size: 0.9rem; }
.pkg { border-top: 2px solid var(--ink); padding-block: 1.4rem 1rem; margin-block-start: 2.5rem; }
.pkg-head { display: grid; grid-template-columns: 1fr auto; gap: 0.2rem 1rem; align-items: baseline; }
.pkg-head .eyebrow { grid-column: 1 / -1; margin: 0; font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.pkg-head .import { grid-column: 1 / -1; margin: 0; color: var(--muted); }
.pkg-head .read { grid-row: 2; grid-column: 2; font-size: 0.85rem; color: var(--muted); display: flex; gap: 0.35rem; align-items: center; cursor: pointer; white-space: nowrap; }
.doc { max-width: 65ch; }
.doc p { margin-block: 0.6rem; }
.doc h4 { font-size: 1.05rem; font-weight: 600; margin: 1.6rem 0 0.4rem; }
.doc ul, .doc ol { padding-inline-start: 1.3rem; }
.doc li { margin-block: 0.25rem; }
pre { background: var(--code-bg); border-radius: 6px; padding: 0.75rem 0.9rem; overflow-x: auto; line-height: 1.5; margin: 0.6rem 0; }
pre code { font-size: 0.82rem; }
.sym { border-top: 1px solid var(--line); padding-block: 0.9rem 0.3rem; }
.sym h4 { margin: 0; font-family: var(--mono); font-size: 0.95rem; font-weight: 500; }
.sym h4 a { color: var(--ink); text-decoration: none; }
.sym h4 a:hover { color: var(--accent); }
.was { margin-block: 0.5rem 0; font-size: 0.85rem; color: var(--changed); }
.was summary { cursor: pointer; }
.was pre { border-inline-start: 3px solid var(--changed); }
.removed { border-top: 1px solid var(--line); margin-block-start: 1.6rem; }
.removed h3 { color: var(--gone); }
.removed-key { margin: 0.8rem 0 0; }
.removed pre { border-inline-start: 3px solid var(--gone); }
@media (max-width: 860px) {
  .layout { grid-template-columns: minmax(0, 1fr); gap: 1rem; }
  .side { position: static; max-height: none; }
  .side > ol { grid-template-columns: repeat(auto-fit, minmax(11rem, 1fr)); gap: 0.8rem; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>
