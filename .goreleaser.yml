# GoReleaser configuration for whynot
# See: https://goreleaser.com

version: 2

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: whynot
    main: ./cmd/whynot
    binary: whynot
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # Windows on arm64 is niche and untested here.
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      # Strip debug info for smaller binaries; embed the release version
      # (shown on the welcome page - see browser.Version); suppress the
      # console window that would otherwise flash open behind the GUI
      # on Windows (ebitengine/hideconsole, already a dependency, also
      # hides it at runtime - this avoids the flash in the first place).
      - -s -w
      - -X github.com/arnodel/whynot/browser.Version={{ .Version }}
      - '{{ if eq .Os "windows" }}-H=windowsgui{{ end }}'

archives:
  - id: whynot-archive
    ids:
      - whynot
    formats:
      - zip
    format_overrides:
      - goos: linux
        formats:
          - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- if eq .Os "darwin" }}macOS
      {{- else }}{{ .Os }}{{ end }}_
      {{- .Arch }}
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
      - '^ci:'
  groups:
    - title: "Features"
      regexp: '^feat:'
      order: 0
    - title: "Bug Fixes"
      regexp: '^fix:'
      order: 1
    - title: "Other Changes"
      order: 999

release:
  github:
    owner: arnodel
    name: whynot
  draft: false
  prerelease: auto
  name_template: "whynot {{.Version}}"
  header: |
    ## whynot {{.Version}}

    On macOS:
    ```bash
    brew install arnodel/tap/whynot
    ```

    Otherwise, download the archive for your platform below, unzip it,
    and run `whynot` (or `whynot some-file.md`).

    Building from source instead:
    ```bash
    go install github.com/arnodel/whynot/cmd/whynot@{{.Tag}}
    ```
  footer: |
    **Full Changelog**: https://github.com/arnodel/whynot/compare/{{ .PreviousTag }}...{{ .Tag }}

# Homebrew tap - publishes to the existing arnodel/homebrew-tap repo
# (already set up for jsonstream). Needs a TAP_GITHUB_TOKEN secret on
# this repo: a fine-grained PAT scoped to homebrew-tap only, with
# Contents (read/write) + Metadata (read) permissions, passed through
# by .github/workflows/release.yaml.
homebrew_casks:
  - name: whynot
    ids:
      - whynot-archive
    repository:
      owner: arnodel
      name: homebrew-tap
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    directory: Casks
    description: "A Markdown file renderer for Ebitengine games"
    homepage: "https://github.com/arnodel/whynot"
    license: "Apache-2.0"
    commit_author:
      name: goreleaserbot
      email: bot@goreleaser.com
    binaries:
      - whynot
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/whynot"]
          end
