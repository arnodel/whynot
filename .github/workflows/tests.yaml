name: Go

on:
  # A pull request is tested through pull_request; testing its branch
  # pushes as well would run the same job twice.
  push:
    branches: [main]
  pull_request:

# Only the latest commit of a branch or PR matters: cancel older runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25

    # The Gio programs (browser/cmd/giowhynot and
    # backends/giobackend/examples/gio) need Gio's native build deps - giobackend itself has
    # none of these, only the windowing package (gioui.org/app) does.
    # Exact list per https://gioui.org/doc/install/linux.
    - name: Install Gio's Linux build dependencies
      run: sudo apt-get update && sudo apt-get install -y gcc pkg-config libwayland-dev libx11-dev libx11-xcb-dev libxkbcommon-x11-dev libgles2-mesa-dev libegl1-mesa-dev libffi-dev libxcursor-dev libvulkan-dev

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files need gofmt:"
          echo "$unformatted"
          exit 1
        fi

    # Three modules (see go.work): the core, the Gio backend in
    # backends/giobackend, and the browser app in browser, which ./...
    # from the root doesn't reach.
    - name: Vet
      run: |
        go vet ./...
        (cd backends/giobackend && go vet ./...)
        (cd browser && go vet ./...)

    - name: All tests
      run: |
        go test -race -coverprofile="coverage.txt" -covermode=atomic ./...
        (cd backends/giobackend && go test -race -coverprofile="coverage.txt" -covermode=atomic ./...)
        (cd browser && go test -race -coverprofile="coverage.txt" -covermode=atomic ./...)

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v2
      with:
        files: ./coverage.txt,./backends/giobackend/coverage.txt,./browser/coverage.txt
        name: codecov-all-tests
        verbose: true
