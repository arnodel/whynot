name: Deploy WASM demos to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time - a newer push cancels an in-flight
# deploy of an older one rather than queueing behind it, so Pages
# always ends up serving the latest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      # cmd/whynot/web is the site root: index.html and wasm_exec.js
      # already live there (see that directory's README); this adds the
      # compiled binary alongside them.
      - name: Build whynot.wasm
        run: GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o cmd/whynot/web/whynot.wasm ./cmd/whynot

      # giowhynot is served at a subpath of the same site
      # (cmd/whynot/web/giowhynot/). Its page,
      # backends/giobackend/cmd/giowhynot/web/index.html, is copied in
      # with the fresh binary and the same wasm_exec.js (Go's wasm
      # runtime glue, the same for both apps - see
      # backends/giobackend/cmd/giowhynot/web/README.md). It's built from
      # its own module's directory.
      - name: Build giowhynot.wasm
        working-directory: backends/giobackend
        run: |
          mkdir -p ../../cmd/whynot/web/giowhynot
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o ../../cmd/whynot/web/giowhynot/giowhynot.wasm ./cmd/giowhynot
          cp cmd/giowhynot/web/index.html ../../cmd/whynot/web/wasm_exec.js ../../cmd/whynot/web/giowhynot/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cmd/whynot/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
