name: Deploy WASM demos to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time - a newer push cancels an in-flight
# deploy of an older one rather than queueing behind it, so Pages
# always ends up serving the latest main.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.25

      # cmd/whynot/web is the site root, unchanged: index.html +
      # wasm_exec.js already live there (see that directory's own
      # README), this step just adds the compiled binary alongside
      # them - the same build a local `GOOS=js GOARCH=wasm go build`
      # from that directory would produce. giowhynot gets a subpath
      # (cmd/whynot/web/giowhynot/) rather than its own top-level
      # site: cmd/giowhynot/web/index.html is still the canonical
      # source for that page, just copied into place here alongside a
      # fresh giowhynot.wasm and the same wasm_exec.js (Go's own wasm
      # runtime glue, not specific to either backend, so not built or
      # committed a second time - see cmd/giowhynot/web/README.md).
      - name: Build whynot.wasm and giowhynot.wasm
        run: |
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o cmd/whynot/web/whynot.wasm ./cmd/whynot
          mkdir -p cmd/whynot/web/giowhynot
          GOOS=js GOARCH=wasm go build -ldflags="-s -w" -o cmd/whynot/web/giowhynot/giowhynot.wasm ./cmd/giowhynot
          cp cmd/giowhynot/web/index.html cmd/whynot/web/wasm_exec.js cmd/whynot/web/giowhynot/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: cmd/whynot/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
